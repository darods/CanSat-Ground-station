[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cansat-ground-station"
version = "0.2.0"
description = "Cross-platform real-time telemetry ground station interface for CanSats and OBCs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "LIDER - ATL Research Group" }
]
dependencies = [
    "numpy>=2.0.0",
    "PyQt6>=6.11.0",
    "pyqtgraph>=0.14.0",
    "pyserial>=3.5",
]

[project.scripts]
cansat-ground-station = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-qt>=4.5.0",
]

[tool.pytest.ini_options]
# Make the project root importable so tests can `import communication`, etc.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=communication --cov=dataBase --cov=graphs --cov=main --cov-report=term-missing"
