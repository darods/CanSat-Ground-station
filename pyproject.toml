[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cansat-ground-station"
version = "0.2.0"
description = "Cross-platform real-time telemetry ground station interface for CanSats and OBCs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "LIDER - ATL Research Group" }
]
dependencies = [
    "numpy>=2.0.0",
    "PyQt6>=6.11.0",
    "pyqtgraph>=0.14.0",
    "pyserial>=3.5",
]

[project.scripts]
cansat-ground-station = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-qt>=4.5.0",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
# Make the project root importable so tests can `import communication`, etc.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=communication --cov=dataBase --cov=graphs --cov=main --cov-report=term-missing"

# Upstream pyqtgraph `_pinv_fallback` mutates `arr.shape` on a NumPy array,
# which NumPy 2.5 deprecates. It is not our code and cannot be fixed here;
# remove this filter once pyqtgraph fixes it.
filterwarnings = [
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:pyqtgraph.functions",
]

[tool.ruff]
# Keep ruff aligned with the project's Python floor.
target-version = "py310"
src = ["."]
exclude = [".venv", ".git"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501", # line length (ruff formatter enforces style instead)
]

[tool.ruff.format]
# ruff format is the enforced style (CI runs `ruff format --check`).

[tool.bandit]
# `random.uniform` (B311) is used only to add noise to the dummy flight
# simulator -- not for anything security-sensitive -- so it is a false
# positive here.
skips = ["B311"]
exclude_dirs = ["tests", ".venv"]

